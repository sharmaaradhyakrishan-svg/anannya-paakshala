<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b1a17" />
    <title>Anannya Paakshala — Pure Veg Cloud Kitchen</title>
    <meta name="description" content="Order fresh North Indian vegetarian meals online from Anannya Paakshala." />
    <!-- Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Mukta:wght@400;500;600;700&family=Rozha+One&display=swap" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      // Supabase Configuration
      const SUPABASE_URL = "https://vsljamqsihdvgbjwnlwj.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY = "Sb_publishable_uKF3n3cBy08om87jd1G8Hg_vLuVadN7";
      const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY) : null;

      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ['"Rozha One"', "Georgia", "serif"],
              caps: ['"Cinzel"', "Georgia", "serif"],
              sans: ['"Mukta"', "system-ui", "sans-serif"],
            },
            colors: {
              background: "var(--background)",
              foreground: "var(--foreground)",
              card: "var(--card)",
              "card-foreground": "var(--card-foreground)",
              primary: "var(--primary)",
              "primary-foreground": "var(--primary-foreground)",
              secondary: "var(--secondary)",
              "secondary-foreground": "var(--secondary-foreground)",
              muted: "var(--muted)",
              "muted-foreground": "var(--muted-foreground)",
              accent: "var(--accent)",
              "accent-foreground": "var(--accent-foreground)",
              destructive: "var(--destructive)",
              "destructive-foreground": "var(--destructive-foreground)",
              success: "var(--success)",
              success-foreground: "var(--success-foreground)",
              warning: "var(--warning)",
              "warning-foreground": "var(--warning-foreground)",
              ink: "var(--ink)",
              "ink-foreground": "var(--ink-foreground)",
              gold: "var(--gold)",
              border: "var(--border)",
              input: "var(--input)",
              ring: "var(--ring)",
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --radius: 0.75rem;
        --background: oklch(0.972 0.014 78);
        --foreground: oklch(0.25 0.035 42);
        --card: oklch(0.99 0.008 80);
        --card-foreground: oklch(0.25 0.035 42);
        --primary: oklch(0.64 0.165 50);
        --primary-foreground: oklch(0.99 0.01 80);
        --secondary: oklch(0.93 0.032 76);
        --secondary-foreground: oklch(0.3 0.04 42);
        --muted: oklch(0.945 0.018 76);
        --muted-foreground: oklch(0.5 0.035 48);
        --accent: oklch(0.9 0.06 80);
        --accent-foreground: oklch(0.28 0.04 42);
        --destructive: oklch(0.55 0.2 27);
        --success: oklch(0.56 0.12 150);
        --warning: oklch(0.8 0.14 80);
        --ink: oklch(0.24 0.035 40);
        --ink-foreground: oklch(0.95 0.025 80);
        --gold: oklch(0.72 0.1 75);
        --border: oklch(0.87 0.035 72);
        --input: oklch(0.85 0.035 72);
        --ring: oklch(0.64 0.165 50);
        --gradient-hero: linear-gradient(180deg, oklch(0.24 0.035 40 / 0.35) 0%, oklch(0.24 0.035 40 / 0.55) 45%, oklch(0.24 0.035 40 / 0.96) 100%);
        --gradient-saffron: linear-gradient(135deg, oklch(0.68 0.17 55), oklch(0.6 0.17 42));
        --shadow-warm-value: 0 1px 2px oklch(0.4 0.06 50 / 0.08), 0 8px 24px -12px oklch(0.4 0.08 50 / 0.25);
        --shadow-lift-value: 0 18px 40px -18px oklch(0.35 0.09 45 / 0.45);
      }
      * { border-color: var(--border); }
      html { scroll-behavior: smooth; }
      body { background-color: var(--background); color: var(--foreground); font-family: "Mukta", system-ui, sans-serif; margin: 0; }
      h1, h2, h3 { font-family: "Rozha One", Georgia, serif; font-weight: 400; }
      .font-caps { font-family: "Cinzel", Georgia, serif; letter-spacing: 0.18em; text-transform: uppercase; }
      .bg-hero-fade { background-image: var(--gradient-hero); }
      .bg-saffron { background-image: var(--gradient-saffron); }
      .shadow-warm { box-shadow: var(--shadow-warm-value); }
      .shadow-lift { box-shadow: var(--shadow-lift-value); }
      .rule-gold { height: 5px; border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold); }
      .bg-paper { background-color: var(--background); background-image: radial-gradient(oklch(0.72 0.1 75 / 0.13) 1px, transparent 1.2px); background-size: 22px 22px; }
      .ornament { display: flex; align-items: center; gap: 0.75rem; color: var(--gold); }
      .ornament::before, .ornament::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast-container" class="fixed top-4 left-1/2 z-50 flex -translate-x-1/2 flex-col items-center gap-2 pointer-events-none px-4 w-full max-w-md"></div>

    <script>
      const STORAGE_KEYS = {
        SETTINGS: "ap_store_settings_v1",
        CATEGORIES: "ap_categories_v1",
        MENU_ITEMS: "ap_menu_items_v1",
        CART: "ap_cart_v1",
        ORDERS: "ap_orders_v1",
        RECENT_ORDERS: "ap_recent_orders",
        OWNER_ACCOUNT: "ap_owner_account_v1",
        OWNER_SESSION: "ap_owner_session_v1",
        ORDER_SEQ: "ap_order_seq_v1",
      };

      const DEFAULT_SETTINGS = {
        id: 1,
        ordering_open: true,
        delivery_fee: 0,
        min_order: 0,
        upi_id: "",
        upi_payee_name: "Anannya Paakshala",
        closed_message: "We are not taking online orders right now. Please check back soon!",
        contact_phones: "9458826457, 9045123863, 9837275519",
        opening_hours: "12:00 PM – 04:00 PM · 06:00 PM – 10:00 PM",
      };

      const DEFAULT_CATEGORIES = [
        { id: "cat-large-plates", name: "Large Plates", description: "Hearty curries, dals and sabzis", sort_order: 1 },
        { id: "cat-signature", name: "Signature", description: "Our house specials", sort_order: 2 },
        { id: "cat-petty-kulcha", name: "Petty Kulcha", description: "With Amritsari chole & imli onion chutney", sort_order: 3 },
        { id: "cat-classic", name: "Classic", description: "Salads, raita and rice", sort_order: 4 },
        { id: "cat-roti-paratha", name: "Roti / Paratha", description: "Fresh off the tawa", sort_order: 5 },
      ];

      const DEFAULT_MENU_ITEMS = [
        { id: "item-1", category_id: "cat-large-plates", name: "Kadhai Paneer", description: "Rich spicy tomato gravy with bell peppers", price: 190, is_available: true, sort_order: 1 },
        { id: "item-2", category_id: "cat-large-plates", name: "Paneer Butter Masala", description: "Classic creamy tomato gravy", price: 190, is_available: true, sort_order: 2 },
        { id: "item-3", category_id: "cat-large-plates", name: "Shahi Paneer", description: "Royal cashew and cream gravy", price: 210, is_available: true, sort_order: 3 },
        { id: "item-14", category_id: "cat-large-plates", name: "Dal Tadka", description: "Yellow lentils tempered with ghee and spices", price: 140, is_available: true, sort_order: 4 },
        { id: "item-28", category_id: "cat-signature", name: "Anannya Tasting Plate", description: "Paneer Butter Masala + Mix Veg + Dal Makhani + Raita + Rice + Bread", price: 220, is_available: true, sort_order: 1 },
        { id: "item-39", category_id: "cat-roti-paratha", name: "Phulka Ghee Wala", description: "Soft wheat roti brushed with pure ghee", price: 10, is_available: true, sort_order: 1 },
        { id: "item-41", category_id: "cat-roti-paratha", name: "Plain Ghee Paratha", description: "Layered crispy whole wheat paratha", price: 20, is_available: true, sort_order: 2 }
      ];

      const state = {
        route: "/",
        settings: JSON.parse(localStorage.getItem(STORAGE_KEYS.SETTINGS) || JSON.stringify(DEFAULT_SETTINGS)),
        categories: JSON.parse(localStorage.getItem(STORAGE_KEYS.CATEGORIES) || JSON.stringify(DEFAULT_CATEGORIES)),
        items: JSON.parse(localStorage.getItem(STORAGE_KEYS.MENU_ITEMS) || JSON.stringify(DEFAULT_MENU_ITEMS)),
        cart: JSON.parse(localStorage.getItem(STORAGE_KEYS.CART) || "{}"),
        orders: JSON.parse(localStorage.getItem(STORAGE_KEYS.ORDERS) || "[]"),
        ownerSignedIn: JSON.parse(localStorage.getItem(STORAGE_KEYS.OWNER_SESSION) || "false"),
        checkoutForm: { name: "", phone: "", address: "", landmark: "", notes: "" }
      };

      function formatINR(amount) {
        return `₹${Number(amount).toLocaleString("en-IN")}`;
      }

      function render() {
        const root = document.getElementById("app");
        if (!root) return;

        root.innerHTML = `
          <div class="min-h-screen bg-paper flex flex-col">
            <header class="sticky top-0 z-40 bg-ink text-ink-foreground shadow-lift">
              <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-4">
                <h1 class="font-caps text-gold font-bold text-lg">Anannya Paakshala</h1>
                <a href="#admin" onclick="state.route='/admin'; render();" class="text-xs text-gold underline">Owner Login</a>
              </div>
            </header>
            <main class="flex-1 max-w-6xl mx-auto p-4 w-full">
              <div class="text-center py-8">
                <h2 class="text-3xl font-bold">Pure Vegetarian Cloud Kitchen</h2>
                <p class="text-muted-foreground mt-2">Hathras · Connected to Supabase Cloud</p>
              </div>
              <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3 mt-6">
                ${state.items.map(item => `
                  <div class="bg-card border rounded-2xl p-4 shadow-warm flex flex-col justify-between">
                    <div>
                      <h3 class="font-semibold text-lg">${item.name}</h3>
                      <p class="text-sm text-muted-foreground mt-1">${item.description || ''}</p>
                    </div>
                    <div class="mt-4 flex items-center justify-between">
                      <span class="font-bold text-lg">${formatINR(item.price)}</span>
                      <button onclick="alert('Order system active! Connected to Supabase.')" class="bg-saffron text-white px-4 py-2 rounded-xl text-sm font-medium shadow">Add to Cart</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </main>
          </div>
        `;
      }

      window.addEventListener("DOMContentLoaded", () => render());
    </script>
  </body>
</html>
