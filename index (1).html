        display: flex;

        gap: 0.75rem;

        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
      }

      .scrollbar-none {
        scrollbar-width: none;
      }

      }

      function formatINR(amount) {
        return `₹${Number(amount).toLocaleString("en-IN")}`;
      }

      function normalizeIndianPhone(input) {
        let digits = String(input || "").replace(/\D/g, "");
        if (digits.length === 12 && digits.startsWith("91")) digits = digits.slice(2);
        if (digits.length === 11 && digits.startsWith("0")) digits = digits.slice(1);
        return /^[6-9]\d{9}$/.test(digits) ? digits : null;
      }

      function buildUpiLink({ upiId, payeeName, amount, orderNumber }) {
        const params = new URLSearchParams({
          pa: upiId.trim(),
          pn: payeeName,
          am: Number(amount).toFixed(2),
          cu: "INR",
          tn: `Order #${orderNumber}`,
        });
        return `upi://pay?${params.toString()}`;
      }

      function getCartSummary() {
        const priced = Object.entries(state.cart)
          .map(([id, quantity]) => {
            const item = state.items.find((i) => i.id === id);
            return item ? { item, price: item.price, quantity } : null;
          })
          .filter(Boolean);

        const subtotal = priced.reduce((sum, l) => sum + l.price * l.quantity, 0);
        const itemCount = priced.reduce((sum, l) => sum + l.quantity, 0);
        const deliveryFee = itemCount > 0 ? Number(state.settings.delivery_fee || 0) : 0;
        const minOrder = Number(state.settings.min_order || 0);
        const shortBy = Math.max(0, minOrder - subtotal);

        return {
          priced,
          totals: {
            itemCount,
            subtotal,
            deliveryFee,
            total: subtotal + deliveryFee,
            meetsMinimum: shortBy === 0,
            shortBy,
          },
        };
      }

      function escapeHtml(str) {
        if (str === null || str === undefined) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function showToast(message, type = "default") {
        const container = document.getElementById("toast-container");
        if (!container) return;
        const el = document.createElement("div");
        const styles =
          type === "error"
            ? "bg-destructive text-destructive-foreground border-destructive"
            : type === "success"
            ? "bg-ink text-ink-foreground border-gold/60"
            : "bg-card text-foreground border-border";
        el.className = `pointer-events-auto flex items-center gap-2 rounded-xl border px-4 py-3 text-sm font-medium shadow-lift animate-rise ${styles}`;
        el.innerHTML = `<span>${escapeHtml(message)}</span>`;
        container.appendChild(el);
        setTimeout(() => {
          el.style.opacity = "0";
          el.style.transition = "opacity 0.25s ease";
          setTimeout(() => el.remove(), 260);
        }, 3200);
      }

      function copyToClipboard(text, successMsg) {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand("copy");
          showToast(successMsg, "success");
        } catch {
          showToast("Could not copy", "error");
        }
        document.body.removeChild(textarea);
      }

      function navigate(to) {
        state.route = to;
        window.scrollTo(0, 0);
        render();
      }

      function setCartQty(id, qty) {
        if (qty <= 0) {
          delete state.cart[id];
        } else {
          state.cart[id] = Math.min(50, qty);
        }
        saveJSON(STORAGE_KEYS.CART, state.cart);
        render();
      }

      function addToCart(id) {
        setCartQty(id, (state.cart[id] || 0) + 1);
      }

      function removeFromCart(id) {
        setCartQty(id, (state.cart[id] || 0) - 1);
      }

      function clearCart() {
        state.cart = {};
        saveJSON(STORAGE_KEYS.CART, state.cart);
      }

      function rememberOrder(id) {
        state.recentOrders = [id, ...state.recentOrders.filter((x) => x !== id)].slice(0, 5);
        saveJSON(STORAGE_KEYS.RECENT_ORDERS, state.recentOrders);
      }

      function placeOrder(e) {
        e.preventDefault();
        const { priced, totals } = getCartSummary();
        const f = state.checkoutForm;
        const errs = {};

        if (f.name.trim().length < 2) errs.name = "Please enter your name";
        const normalizedPhone = normalizeIndianPhone(f.phone);
        if (!normalizedPhone) errs.phone = "Enter a valid 10-digit mobile number";
        if (f.address.trim().length < 8) errs.address = "Please enter your full address";

        state.checkoutErrors = errs;
        if (Object.keys(errs).length > 0) {
          render();
          return;
        }

        if (!state.settings.ordering_open) {
          showToast("Sorry, we are not taking online orders right now.", "error");
          return;
        }

        if (!totals.meetsMinimum || priced.length === 0) {
          showToast(`Minimum order is ${formatINR(state.settings.min_order)}.`, "error");
          return;
        }

        const unavailable = priced.find((p) => !p.item.is_available);
        if (unavailable) {
          showToast(`${unavailable.item.name} is sold out right now. Please remove it from your cart.`, "error");
          return;
        }

        const seq = Number(loadJSON(STORAGE_KEYS.ORDER_SEQ, 1001));
        saveJSON(STORAGE_KEYS.ORDER_SEQ, seq + 1);

        const orderId =
          typeof crypto !== "undefined" && crypto.randomUUID
            ? crypto.randomUUID()
            : "ord-" + Date.now() + "-" + Math.floor(Math.random() * 10000);

        const upiAvailable = Boolean((state.settings.upi_id || "").trim());
        const paymentMethod = state.checkoutPayment === "upi" && upiAvailable ? "upi" : "cod";

        const newOrder = {
          id: orderId,
          order_number: seq,
          customer_name: f.name.trim(),
          phone: normalizedPhone,
          address: f.address.trim(),
          landmark: f.landmark.trim() || null,
          notes: f.notes.trim() || null,
          payment_method: paymentMethod,
          payment_status: "unpaid",
          upi_reference: null,
          subtotal: totals.subtotal,
          delivery_fee: totals.deliveryFee,
          total: totals.total,
          status: "pending",
          reject_reason: null,
          created_at: new Date().toISOString(),
          updated_at: new Date().toISOString(),
          order_items: priced.map((p) => ({
            name: p.item.name,
            unit_price: p.item.price,
            quantity: p.quantity,
          })),
        };

        state.orders = [newOrder, ...state.orders];
        saveJSON(STORAGE_KEYS.ORDERS, state.orders);
        rememberOrder(orderId);
        clearCart();
        state.checkoutForm = { name: "", phone: "", address: "", landmark: "", notes: "" };
        state.checkoutErrors = {};
        showToast(`Order #${seq} placed!`, "success");
        navigate(`/order/${orderId}`);
      }

      function submitUpiReference(orderId) {
        const input = document.getElementById("upi-ref-input");
        const ref = (input ? input.value : "").trim();
        if (ref.length < 4 || ref.length > 40) {
          showToast("Please enter the 12-digit UPI reference (UTR) number.", "error");
          return;
        }
        state.orders = state.orders.map((o) =>
          o.id === orderId && o.payment_method === "upi" && o.payment_status === "unpaid"
            ? { ...o, upi_reference: ref, updated_at: new Date().toISOString() }
            : o
        );
        saveJSON(STORAGE_KEYS.ORDERS, state.orders);
        showToast("Thanks! The kitchen will confirm your payment.", "success");
        render();
      }

        e.preventDefault();
        const email = document.getElementById("owner-email").value.trim();
        const pw = document.getElementById("owner-pw").value;
        if (!email || pw.length < 8) {
          showToast("Enter a valid email and at least 8-character password.", "error");
          return;

        if (!state.ownerAccount) {
          state.ownerAccount = { email, password: pw };
          state.ownerSignedIn = true;
          saveJSON(STORAGE_KEYS.OWNER_ACCOUNT, state.ownerAccount);
          saveJSON(STORAGE_KEYS.OWNER_SESSION, true);
          showToast("Owner account created & signed in.", "success");
          render();
        } else {
          if (
            email.toLowerCase() === state.ownerAccount.email.toLowerCase() &&
            pw === state.ownerAccount.password
          ) {
            state.ownerSignedIn = true;
            saveJSON(STORAGE_KEYS.OWNER_SESSION, true);
            showToast("Signed in to Owner Dashboard", "success");
            render();
          } else {
            showToast("Wrong email or password.", "error");
          }
        }
      }

        const name = document.getElementById("draft-name").value.trim();

      // Admin Settings Actions
      function saveStoreSettings(e) {
        e.preventDefault();
        const ordering_open = document.getElementById("set-open").checked;
        const delivery_fee = Number(document.getElementById("set-fee").value);
        const min_order = Number(document.getElementById("set-min").value);
        const upi_id = document.getElementById("set-upi").value.trim();
        const upi_payee_name = document.getElementById("set-payee").value.trim() || "Anannya Paakshala";
        const contact_phones = document.getElementById("set-phones").value.trim();
        const opening_hours = document.getElementById("set-hours").value.trim();
        const closed_message = document.getElementById("set-closed-msg").value.trim();

        if (
          !Number.isInteger(delivery_fee) ||
          delivery_fee < 0 ||
          !Number.isInteger(min_order) ||
          min_order < 0
        ) {
          showToast("Fees must be whole rupees, 0 or more", "error");
          return;
        }

        state.settings = {
          ...state.settings,
          ordering_open,
          delivery_fee,
          min_order,
          upi_id,
          upi_payee_name,
          contact_phones,
          opening_hours,
          closed_message,
        };
        saveJSON(STORAGE_KEYS.SETTINGS, state.settings);
        showToast("Settings saved", "success");
        render();
      }

                      onclick="state.checkoutPayment = 'cod'; render();"
                      class="flex items-start gap-3 rounded-xl border p-4 text-left transition-colors ${

                    ${

                        ? `<button type="button" role="radio" aria-checked="${state.checkoutPayment === "upi"}"
                            onclick="state.checkoutPayment = 'upi'; render();"
                            class="flex items-start gap-3 rounded-xl border p-4 text-left transition-colors ${
                              state.checkoutPayment === "upi"
                                ? "border-primary bg-primary/5 ring-1 ring-primary"
                                : "border-border hover:border-primary/50"
                            }">
                            <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full ${
                              state.checkoutPayment === "upi"
                                ? "bg-primary text-primary-foreground"
                                : "bg-muted text-muted-foreground"
                            }">
                              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>

                  <dl class="mt-4 space-y-2 text-sm">
                    <div class="flex items-center justify-between text-muted-foreground">
                      <dt>Items (${totals.itemCount})</dt>
                      <dd class="font-medium text-foreground">${formatINR(totals.subtotal)}</dd>

                    <div class="flex items-center justify-between text-muted-foreground">
                      <dt>Delivery</dt>

                    <div class="rule-gold my-3 opacity-50"></div>
                    <div class="flex items-center justify-between text-muted-foreground">
                      <dt class="text-base font-semibold text-foreground">To pay</dt>
                      <dd class="text-xl font-semibold text-foreground">${formatINR(totals.total)}</dd>
                    </div>
                  </dl>

                  ${
                    !settings.ordering_open
                      ? `<p class="mt-4 rounded-lg bg-destructive/10 p-3 text-sm text-destructive">Online ordering is closed right now. ${escapeHtml(settings.closed_message)}</p>`

                    settings.ordering_open && !totals.meetsMinimum
                      ? `<p class="mt-4 rounded-lg bg-warning/25 p-3 text-sm text-warning-foreground">Minimum order is ${formatINR(settings.min_order)}. Add ${formatINR(totals.shortBy)} more.</p>`

      function renderOrderPage(orderId) {
        const order = state.orders.find((o) => o.id === orderId);
        if (!order) {
          return renderCustomerShell(`
            <div class="mx-auto max-w-md px-4 py-24 text-center">
              <h1 class="text-3xl">Order not found</h1>
              <p class="mt-2 text-muted-foreground">Please check the link, or call us for help.</p>
              <a href="#/" onclick="event.preventDefault(); navigate('/')" class="mt-6 inline-flex h-10 items-center justify-center rounded-md bg-saffron px-4 py-2 text-sm font-medium text-primary-foreground shadow-warm">Back to menu</a>
            </div>
          `);
        }

        const phones = phonesOf(state.settings.contact_phones);
        const stopped = order.status === "rejected" || order.status === "cancelled";
        const currentIdx = PROGRESS_STEPS.indexOf(order.status);

        const stepLabels = {
          pending: "Placed",
          accepted: "Confirmed",
          preparing: "Cooking",
          out_for_delivery: "On the way",
          delivered: "Delivered",
        };

        let upiPanelHtml = "";
        if (order.payment_method === "upi" && !stopped) {
          if (order.payment_status === "paid") {
            upiPanelHtml = `
              <div class="mt-6 flex items-center gap-3 rounded-2xl border border-success/40 bg-success/10 p-5">
                <svg class="h-6 w-6 text-success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
                <p class="font-medium">Payment of ${formatINR(order.total)} received. Thank you!</p>
              </div>
            `;
          } else if (state.settings.upi_id) {
            const link = buildUpiLink({
              upiId: state.settings.upi_id,
              payeeName: state.settings.upi_payee_name,
              amount: order.total,
              orderNumber: order.order_number,
            });
            upiPanelHtml = `
              <div class="mt-6 rounded-2xl border border-primary/40 bg-primary/5 p-5">
                <h2 class="text-xl">Pay ${formatINR(order.total)} by UPI</h2>
                <p class="mt-1 text-sm text-muted-foreground">Tap the button on your phone to open GPay, PhonePe, Paytm or any UPI app.</p>
                <div class="mt-4 flex flex-wrap items-center gap-3">
                  <a href="${escapeHtml(link)}" class="inline-flex h-11 items-center justify-center rounded-lg bg-saffron px-6 text-base font-medium text-primary-foreground shadow-warm">Pay now with UPI</a>
                  <button type="button" onclick="copyToClipboard('${escapeHtml(state.settings.upi_id)}', 'UPI ID copied')" class="inline-flex items-center gap-2 rounded-lg border border-border bg-card px-3 py-2 text-sm hover:bg-muted">
                    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                    ${escapeHtml(state.settings.upi_id)}
                  </button>
                </div>
                <div class="mt-5">
                  ${
                    order.upi_reference
                      ? `<p class="text-sm">Reference submitted: <span class="font-mono font-medium">${escapeHtml(order.upi_reference)}</span> — waiting for the kitchen to confirm.</p>`
                      : `
                        <p class="text-sm font-medium">After paying, enter the UPI reference / UTR number</p>
                        <div class="mt-2 flex gap-2">
                          <input id="upi-ref-input" type="text" placeholder="e.g. 412345678901" maxlength="40" inputmode="numeric"
                            class="flex h-9 w-full rounded-md border border-input bg-card px-3 py-1 text-base shadow-sm focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring md:text-sm" />
                          <button type="button" onclick="submitUpiReference('${order.id}')" class="inline-flex h-9 items-center justify-center rounded-md bg-ink px-4 text-sm font-medium text-ink-foreground shadow-sm hover:bg-ink/90">
                            Submit
                          </button>
                        </div>
                      `
                  }
                </div>
              </div>
            `;
          }
        }

        const content = `
          <div class="mx-auto max-w-3xl px-4 py-8">
            <div class="rounded-3xl border border-border bg-card p-6 text-center shadow-warm sm:p-8">
              <p class="font-caps text-xs text-gold">Order #${order.order_number}</p>
              ${
                stopped
                  ? `
                    <svg class="mx-auto mt-4 h-14 w-14 text-destructive" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
                    <h1 class="mt-3 text-3xl">Order ${order.status === "rejected" ? "not accepted" : "cancelled"}</h1>
                    <p class="mt-2 text-muted-foreground">${escapeHtml(order.reject_reason || "Sorry, we couldn’t take this order. Please call us for help.")}</p>
                  `
                  : `
                    <h1 class="mt-3 text-3xl sm:text-4xl">${
                      order.status === "pending"
                        ? "Thank you! Order placed"
                        : STATUS_LABEL[order.status]
                    }</h1>
                    <p class="mt-2 text-muted-foreground">
                      ${
                        order.status === "pending"
                          ? "The kitchen will confirm your order shortly. This page updates by itself."
                          : order.status === "accepted"
                          ? "Your order is confirmed and will be cooked fresh."
                          : order.status === "preparing"
                          ? "Our cooks are preparing your food right now."
                          : order.status === "out_for_delivery"
                          ? "Your food is on the way!"
                          : "Enjoy your meal! We hope to serve you again."
                      }
                    </p>

                    <ol class="mt-8 grid grid-cols-5 gap-1">
                      ${PROGRESS_STEPS.map((s, i) => {
                        const done = i <= currentIdx;
                        const current = i === currentIdx;
                        return `
                          <li class="flex flex-col items-center gap-2">
                            <span class="grid h-10 w-10 place-items-center rounded-full border-2 transition-colors ${
                              done
                                ? "border-primary bg-primary text-primary-foreground"
                                : "border-border bg-muted text-muted-foreground"
                            } ${current && s !== "delivered" ? "animate-ring" : ""}">
                              ${
                                done && !current
                                  ? `<svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`
                                  : `<span class="text-xs font-bold">${i + 1}</span>`
                              }
                            </span>
                            <span class="text-[11px] leading-tight sm:text-xs ${
                              done ? "font-semibold text-foreground" : "text-muted-foreground"
                            }">
                              ${stepLabels[s]}
                            </span>
                          </li>
                        `;
                      }).join("")}
                    </ol>
                  `
              }
            </div>

            ${upiPanelHtml}

            <div class="mt-6 rounded-2xl border border-border bg-card p-5 shadow-warm">
              <h2 class="text-xl">Order details</h2>
              <ul class="mt-3 divide-y divide-border text-sm">
                ${order.order_items
                  .map(
                    (it) => `
                  <li class="flex justify-between py-2">
                    <span>${it.quantity} × ${escapeHtml(it.name)}</span>
                    <span class="font-medium">${formatINR(it.unit_price * it.quantity)}</span>
                  </li>`
                  )
                  .join("")}
              </ul>
              <div class="rule-gold my-3 opacity-50"></div>
              <div class="space-y-1 text-sm">
                <div class="flex justify-between text-muted-foreground"><span>Items</span><span>${formatINR(order.subtotal)}</span></div>
                <div class="flex justify-between text-muted-foreground"><span>Delivery</span><span>${order.delivery_fee ? formatINR(order.delivery_fee) : "Free"}</span></div>
                <div class="flex justify-between pt-1 text-base font-semibold"><span>Total</span><span>${formatINR(order.total)}</span></div>
              </div>
              <div class="mt-4 grid gap-3 text-sm sm:grid-cols-2">
                <div class="rounded-xl bg-muted p-3">
                  <p class="text-muted-foreground">Deliver to</p>
                  <p class="font-medium">${escapeHtml(order.customer_name)}</p>
                  <p>${escapeHtml(order.address)}</p>
                </div>
                <div class="rounded-xl bg-muted p-3">
                  <p class="text-muted-foreground">Payment</p>
                  <p class="font-medium">${PAYMENT_LABEL[order.payment_method]}</p>
                  <p>${
                    order.payment_status === "paid"
                      ? "Paid ✓"
                      : order.payment_method === "cod"
                      ? `Pay ${formatINR(order.total)} on delivery`
                      : "Awaiting payment"
                  }</p>
                </div>
              </div>
            </div>

            <div class="mt-6 flex flex-wrap items-center justify-center gap-2">
              <span class="text-sm text-muted-foreground">Need help?</span>
              ${phones
                .map(
                  (p) => `
                <a href="tel:${escapeHtml(p)}" class="inline-flex h-8 items-center gap-1.5 rounded-md border border-input bg-background px-3 text-xs font-medium shadow-sm hover:bg-accent">
                  <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                  ${escapeHtml(p)}
                </a>`
                )
                .join("")}
            </div>
            <div class="mt-6 text-center">
              <a href="#/" onclick="event.preventDefault(); navigate('/')" class="text-sm font-medium text-primary underline-offset-4 hover:underline">Order something else</a>
            </div>
          </div>
        `;

        return renderCustomerShell(content);
      }

      function renderOwnerLogin() {
        const ownerExists = Boolean(state.ownerAccount);
        return `
          <div class="flex min-h-screen items-center justify-center bg-background px-4">
            <form onsubmit="handleOwnerAuth(event)" class="w-full max-w-sm space-y-4 rounded-xl border bg-card p-6 shadow-sm">
              <div class="flex justify-center">
                <div class="rounded-xl bg-ink px-4 py-2.5">
                  ${renderBrandLogo("h-12")}

              <div class="space-y-1.5">
                <label class="text-sm font-medium" for="owner-email">Email</label>
                <input id="owner-email" type="email" required value="${
                  ownerExists ? escapeHtml(state.ownerAccount.email) : ""

              </div>
              <button type="submit" class="inline-flex h-9 w-full items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground shadow hover:bg-primary/90">

              </button>
              ${
                !ownerExists
                  ? `<p class="text-center text-xs text-muted-foreground">The first account created becomes the only owner.</p>`

              }
              <div class="pt-2 text-center">
                <a href="#/" onclick="event.preventDefault(); navigate('/')" class="text-xs text-muted-foreground hover:text-foreground">← Back to storefront</a>
              </div>
            </form>
          </div>
        `;
      }

      function renderAdminOrdersTab() {
        const open = state.settings.ordering_open;
        const activeCount = state.orders.filter((o) =>
          ACTIVE_STATUSES.includes(o.status)
        ).length;
        const shown = state.orders.filter(
          (o) =>
            (state.adminOrderFilter === "active") ===
            ACTIVE_STATUSES.includes(o.status)
        );

        return `
          <div class="space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3 rounded-xl border bg-card p-4">
              <div>
                <p class="font-medium">Online ordering</p>
                <p class="text-sm text-muted-foreground">${
                  open ? "Customers can place orders" : "Ordering is closed"
                }</p>
              </div>
              <label class="relative inline-flex cursor-pointer items-center">
                <input type="checkbox" ${open ? "checked" : ""} onchange="toggleOrderingOpen(this.checked)" class="peer sr-only" />
                <div class="h-6 w-11 rounded-full bg-input peer-checked:bg-primary transition-colors after:absolute after:left-[2px] after:top-[2px] after:h-5 after:w-5 after:rounded-full after:bg-background after:shadow after:transition-all peer-checked:after:translate-x-5"></div>
              </label>
            </div>

            <div class="flex gap-2">
              <button type="button" onclick="state.adminOrderFilter = 'active'; render();"
                class="inline-flex h-8 items-center rounded-md px-3 text-xs font-medium ${
                  state.adminOrderFilter === "active"
                    ? "bg-primary text-primary-foreground shadow"
                    : "border border-input bg-background hover:bg-accent"
                }">
                Active (${activeCount})
              </button>
              <button type="button" onclick="state.adminOrderFilter = 'done'; render();"
                class="inline-flex h-8 items-center rounded-md px-3 text-xs font-medium ${
                  state.adminOrderFilter === "done"
                    ? "bg-primary text-primary-foreground shadow"
                    : "border border-input bg-background hover:bg-accent"
                }">
                Completed
              </button>
            </div>

            ${
              shown.length === 0
                ? `<p class="py-12 text-center text-muted-foreground">No orders here yet.</p>`
                : ""
            }

            <div class="grid gap-4 md:grid-cols-2">
              ${shown
                .map((o) => {
                  const next = NEXT_STATUS[o.status];
                  return `
                    <div class="space-y-3 rounded-xl border bg-card p-4 ${
                      o.status === "pending" ? "border-primary ring-1 ring-primary" : ""
                    }">
                      <div class="flex items-start justify-between gap-2">
                        <div>
                          <p class="font-semibold">#${o.order_number} · ${escapeHtml(o.customer_name)}</p>
                          <p class="text-xs text-muted-foreground">${new Date(o.created_at).toLocaleString("en-IN")}</p>
                        </div>
                        <span class="inline-flex items-center rounded-md px-2.5 py-0.5 text-xs font-semibold ${
                          o.status === "pending"
                            ? "bg-primary text-primary-foreground"
                            : "bg-secondary text-secondary-foreground"
                        }">
                          ${SHORT_STATUS[o.status]}
                        </span>
                      </div>

                      <div class="space-y-1 text-sm">
                        <a href="tel:${escapeHtml(o.phone)}" class="flex items-center gap-1 text-primary hover:underline">
                          📞 ${escapeHtml(o.phone)}
                        </a>
                        <p>📍 ${escapeHtml(o.address)}${o.landmark ? ` (${escapeHtml(o.landmark)})` : ""}</p>
                        ${o.notes ? `<p class="rounded bg-muted p-2 text-xs">Note: ${escapeHtml(o.notes)}</p>` : ""}
                      </div>

                      <ul class="divide-y text-sm">
                        ${o.order_items
                          .map(
                            (i) => `
                          <li class="flex justify-between py-1">
                            <span>${i.quantity} × ${escapeHtml(i.name)}</span>
                            <span>${formatINR(i.unit_price * i.quantity)}</span>
                          </li>`
                          )
                          .join("")}
                      </ul>

                      <div class="flex justify-between border-t pt-2 text-sm">
                        <span>
                          ${PAYMENT_LABEL[o.payment_method]} · <b>${
                    o.payment_status === "paid" ? "Paid" : "Unpaid"
                  }</b>
                          ${
                            o.upi_reference
                              ? `<span class="block text-xs text-muted-foreground">UPI ref: ${escapeHtml(o.upi_reference)}</span>`
                              : ""
                          }
                        </span>
                        <span class="font-semibold">${formatINR(o.total)}</span>
                      </div>

                      <div class="flex flex-wrap gap-2">
                        ${
                          o.status === "pending"
                            ? `
                              <button type="button" onclick="updateOrder('${o.id}', { status: 'accepted' })" class="inline-flex h-8 items-center rounded-md bg-primary px-3 text-xs font-medium text-primary-foreground shadow hover:bg-primary/90">Accept</button>
                              <button type="button" onclick="state.rejectModalOrderId = '${o.id}'; state.rejectModalReason = 'Sorry, we can\\'t take this order right now.'; render();" class="inline-flex h-8 items-center rounded-md bg-destructive px-3 text-xs font-medium text-destructive-foreground shadow-sm hover:bg-destructive/90">Reject</button>
                            `
                            : ""
                        }
                        ${
                          next
                            ? `<button type="button" onclick="updateOrder('${o.id}', { status: '${next.to}' })" class="inline-flex h-8 items-center rounded-md bg-primary px-3 text-xs font-medium text-primary-foreground shadow hover:bg-primary/90">${next.label}</button>`
                            : ""
                        }
                        ${
                          o.payment_status === "unpaid" && o.status !== "rejected"
                            ? `<button type="button" onclick="updateOrder('${o.id}', { payment_status: 'paid' })" class="inline-flex h-8 items-center rounded-md border border-input bg-background px-3 text-xs font-medium shadow-sm hover:bg-accent">Mark paid</button>`
                            : ""
                        }
                        ${
                          ACTIVE_STATUSES.includes(o.status) && o.status !== "pending"
                            ? `<button type="button" onclick="state.cancelConfirmOrderId = '${o.id}'; render();" class="inline-flex h-8 items-center rounded-md px-3 text-xs font-medium hover:bg-accent">Cancel</button>`
                            : ""
                        }
                        <a href="#/order/${o.id}" onclick="event.preventDefault(); navigate('/order/${o.id}')" class="ml-auto inline-flex h-8 items-center rounded-md px-2 text-xs text-muted-foreground hover:text-foreground">View live page →</a>
                      </div>
                    </div>
                  `;
                })
                .join("")}
            </div>

            ${
              state.rejectModalOrderId
                ? `<div class="fixed inset-0 z-50 grid place-items-center bg-black/70 p-4">
                    <div class="w-full max-w-md space-y-4 rounded-xl border bg-background p-6 shadow-lg">
                      <h3 class="text-lg font-semibold">Reject order</h3>
                      <div class="space-y-1.5">
                        <label class="text-sm font-medium">Reason for rejecting (shown to customer):</label>
                        <input id="reject-reason-input" type="text" value="${escapeHtml(state.rejectModalReason)}" class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-sm" />
                      </div>
                      <div class="flex justify-end gap-2">
                        <button type="button" onclick="state.rejectModalOrderId = null; render();" class="inline-flex h-9 items-center rounded-md border border-input px-4 text-sm font-medium hover:bg-accent">Close</button>
                        <button type="button" onclick="const r = document.getElementById('reject-reason-input').value; updateOrder('${state.rejectModalOrderId}', { status: 'rejected', reject_reason: r }); state.rejectModalOrderId = null; render();" class="inline-flex h-9 items-center rounded-md bg-destructive px-4 text-sm font-medium text-destructive-foreground">Reject order</button>
                      </div>
                    </div>
                  </div>`
                : ""
            }

            ${
              state.cancelConfirmOrderId
                ? `<div class="fixed inset-0 z-50 grid place-items-center bg-black/70 p-4">
                    <div class="w-full max-w-sm space-y-4 rounded-xl border bg-background p-6 shadow-lg">
                      <h3 class="text-lg font-semibold">Cancel this order?</h3>
                      <p class="text-sm text-muted-foreground">The customer will see that their order has been cancelled.</p>
                      <div class="flex justify-end gap-2">
                        <button type="button" onclick="state.cancelConfirmOrderId = null; render();" class="inline-flex h-9 items-center rounded-md border border-input px-4 text-sm font-medium hover:bg-accent">Keep order</button>
                        <button type="button" onclick="updateOrder('${state.cancelConfirmOrderId}', { status: 'cancelled' }); state.cancelConfirmOrderId = null; render();" class="inline-flex h-9 items-center rounded-md bg-destructive px-4 text-sm font-medium text-destructive-foreground">Cancel order</button>
                      </div>
                    </div>
                  </div>`
                : ""
            }
          </div>
        `;
      }

      function renderAdminMenuTab() {
        const q = state.adminMenuQuery.toLowerCase();
        const filtered = state.items.filter((i) => i.name.toLowerCase().includes(q));
        const sortedCats = [...state.categories].sort((a, b) => a.sort_order - b.sort_order);
        const groups = [
          ...sortedCats.map((c) => ({ id: c.id, name: c.name })),
          { id: null, name: "Other" },
        ];
        const draft = state.adminMenuDraft;

        return `
          <div class="space-y-4">
            <div class="flex gap-2">
              <input type="text" placeholder="Search dishes…" value="${escapeHtml(state.adminMenuQuery)}"
                oninput="state.adminMenuQuery = this.value; render();"
                class="flex h-9 w-full rounded-md border border-input bg-card px-3 py-1 text-sm shadow-sm focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring" />
              <button type="button"
                onclick="state.adminMenuDraft = { name: '', description: '', price: '', image_url: '', category_id: '${sortedCats[0]?.id || ""}' }; render();"
                class="inline-flex h-9 shrink-0 items-center gap-1 rounded-md bg-primary px-4 text-sm font-medium text-primary-foreground shadow hover:bg-primary/90">
                + Add dish
              </button>
            </div>

            ${groups
              .map((g) => {
                const list = filtered
                  .filter((i) => (g.id === null ? !i.category_id : i.category_id === g.id))
                  .sort((a, b) => a.sort_order - b.sort_order);
                if (!list.length) return "";
                return `
                  <section class="rounded-xl border bg-card">
                    <h2 class="border-b px-4 py-2 font-sans text-base font-semibold">${escapeHtml(g.name)}</h2>
                    <ul class="divide-y">
                      ${list
                        .map(
                          (it) => `
                        <li class="flex items-center gap-3 px-4 py-2.5">
                          <div class="min-w-0 flex-1">
                            <p class="truncate font-medium ${
                              it.is_available ? "" : "text-muted-foreground line-through"
                            }">${escapeHtml(it.name)}</p>
                            <div class="mt-0.5 flex items-center gap-1 text-sm">
                              ₹<input type="number" min="0" value="${it.price}"
                                onblur="const v = Number(this.value); if (Number.isInteger(v) && v >= 0 && v !== ${it.price}) { patchMenuItem('${it.id}', { price: v }); showToast('${escapeHtml(it.name)}: ' + formatINR(v), 'success'); }"
                                class="h-7 w-20 rounded-md border border-input bg-transparent px-2 text-sm" />
                            </div>
                          </div>

                          <label class="relative inline-flex cursor-pointer items-center" aria-label="Available">
                            <input type="checkbox" ${it.is_available ? "checked" : ""}
                              onchange="patchMenuItem('${it.id}', { is_available: this.checked })"
                              class="peer sr-only" />
                            <div class="h-5 w-9 rounded-full bg-input peer-checked:bg-primary transition-colors after:absolute after:left-[2px] after:top-[2px] after:h-4 after:w-4 after:rounded-full after:bg-background after:shadow after:transition-all peer-checked:after:translate-x-4"></div>
                          </label>

                          <button type="button" title="Edit dish"
                            onclick="state.adminMenuDraft = { id: '${it.id}', name: ${escapeHtml(JSON.stringify(it.name))}, description: ${escapeHtml(JSON.stringify(it.description || ""))}, price: '${it.price}', image_url: ${escapeHtml(JSON.stringify(it.image_url || ""))}, category_id: '${it.category_id || ""}' }; render();"
                            class="inline-flex h-8 w-8 items-center justify-center rounded-md hover:bg-accent">
                            ✎
                          </button>
                          <button type="button" title="Delete dish"
                            onclick="state.deleteConfirmItem = { id: '${it.id}', name: ${escapeHtml(JSON.stringify(it.name))} }; render();"
                            class="inline-flex h-8 w-8 items-center justify-center rounded-md text-destructive hover:bg-accent">
                            🗑
                          </button>
                        </li>`
                        )
                        .join("")}
                    </ul>
                  </section>
                `;
              })
              .join("")}

            ${
              draft
                ? `<div class="fixed inset-0 z-50 grid place-items-center bg-black/70 p-4">
                    <div class="w-full max-w-lg space-y-4 rounded-xl border bg-background p-6 shadow-lg">
                      <div class="flex items-center justify-between">
                        <h3 class="text-lg font-semibold">${draft.id ? "Edit dish" : "Add dish"}</h3>
                        <button type="button" onclick="state.adminMenuDraft = null; render();" class="text-sm text-muted-foreground hover:text-foreground">✕</button>
                      </div>
                      <div class="space-y-3">
                        <div>
                          <label class="text-sm font-medium">Name</label>
                          <input id="draft-name" type="text" value="${escapeHtml(draft.name)}" class="mt-1 flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm" />
                        </div>
                        <div>
                          <label class="text-sm font-medium">Price (₹)</label>
                          <input id="draft-price" type="number" min="0" value="${escapeHtml(draft.price)}" class="mt-1 flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm" />
                        </div>
                        <div>
                          <label class="text-sm font-medium">Category</label>
                          <select id="draft-cat" class="mt-1 h-9 w-full rounded-md border border-input bg-background px-2 text-sm">
                            <option value="">Other</option>
                            ${sortedCats
                              .map(
                                (c) =>
                                  `<option value="${c.id}" ${
                                    draft.category_id === c.id ? "selected" : ""
                                  }>${escapeHtml(c.name)}</option>`
                              )
                              .join("")}
                          </select>
                        </div>
                        <div>
                          <label class="text-sm font-medium">Description</label>
                          <textarea id="draft-desc" rows="2" class="mt-1 flex w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm">${escapeHtml(draft.description)}</textarea>
                        </div>
                        <div>
                          <label class="text-sm font-medium">Photo link (optional)</label>
                          <input id="draft-img" type="text" placeholder="https://…" value="${escapeHtml(draft.image_url)}" class="mt-1 flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm" />
                        </div>
                        <button type="button" onclick="saveMenuDraft()" class="inline-flex h-9 w-full items-center justify-center rounded-md bg-primary px-4 text-sm font-medium text-primary-foreground shadow hover:bg-primary/90">
                          Save
                        </button>
                      </div>
                    </div>
                  </div>`
                : ""
            }

            ${
              state.deleteConfirmItem
                ? `<div class="fixed inset-0 z-50 grid place-items-center bg-black/70 p-4">
                    <div class="w-full max-w-sm space-y-4 rounded-xl border bg-background p-6 shadow-lg">
                      <h3 class="text-lg font-semibold">Delete "${escapeHtml(state.deleteConfirmItem.name)}" from the menu?</h3>
                      <div class="flex justify-end gap-2">
                        <button type="button" onclick="state.deleteConfirmItem = null; render();" class="inline-flex h-9 items-center rounded-md border border-input px-4 text-sm font-medium hover:bg-accent">Cancel</button>
                        <button type="button" onclick="deleteMenuItem('${state.deleteConfirmItem.id}')" class="inline-flex h-9 items-center rounded-md bg-destructive px-4 text-sm font-medium text-destructive-foreground">Delete</button>
                      </div>
                    </div>
                  </div>`
                : ""
            }
          </div>
        `;
      }

      function renderAdminSettingsTab() {
        const s = state.settings;
        return `
          <form onsubmit="saveStoreSettings(event)" class="mx-auto max-w-xl space-y-4 rounded-xl border bg-card p-5">
            <div class="flex items-center justify-between">
              <label class="text-sm font-medium" for="set-open">Online ordering open</label>
              <label class="relative inline-flex cursor-pointer items-center">
                <input id="set-open" type="checkbox" ${s.ordering_open ? "checked" : ""} class="peer sr-only" />
                <div class="h-5 w-9 rounded-full bg-input peer-checked:bg-primary transition-colors after:absolute after:left-[2px] after:top-[2px] after:h-4 after:w-4 after:rounded-full after:bg-background after:shadow after:transition-all peer-checked:after:translate-x-4"></div>
              </label>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-sm font-medium" for="set-fee">Delivery fee (₹)</label>
                <input id="set-fee" type="number" min="0" value="${s.delivery_fee}" class="mt-1 flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm" />
              </div>
              <div>
                <label class="text-sm font-medium" for="set-min">Minimum order (₹)</label>
                <input id="set-min" type="number" min="0" value="${s.min_order}" class="mt-1 flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm" />
              </div>
            </div>
            <div>
              <label class="text-sm font-medium" for="set-upi">UPI ID (leave empty to hide online payment)</label>
              <input id="set-upi" type="text" placeholder="name@upi" value="${escapeHtml(s.upi_id || "")}" class="mt-1 flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm" />
            </div>
            <div>
              <label class="text-sm font-medium" for="set-payee">UPI payee name</label>
              <input id="set-payee" type="text" value="${escapeHtml(s.upi_payee_name)}" class="mt-1 flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm" />
            </div>
            <div>
              <label class="text-sm font-medium" for="set-phones">Contact phones</label>
              <input id="set-phones" type="text" value="${escapeHtml(s.contact_phones)}" class="mt-1 flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm" />
            </div>
            <div>
              <label class="text-sm font-medium" for="set-hours">Opening hours</label>
              <input id="set-hours" type="text" value="${escapeHtml(s.opening_hours)}" class="mt-1 flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm" />
            </div>
            <div>
              <label class="text-sm font-medium" for="set-closed-msg">Message when closed</label>
              <textarea id="set-closed-msg" rows="3" class="mt-1 flex w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm">${escapeHtml(s.closed_message)}</textarea>
            </div>
            <button type="submit" class="inline-flex h-9 w-full items-center justify-center rounded-md bg-primary px-4 text-sm font-medium text-primary-foreground shadow hover:bg-primary/90">
              Save settings
            </button>
          </form>
        `;
      }

      function renderAdminLayout() {
        if (!state.ownerSignedIn) {
          return renderOwnerLogin();
        }

        const tabs = [
          { to: "/admin", label: "Orders" },
          { to: "/admin/menu", label: "Menu" },
          { to: "/admin/settings", label: "Settings" },
        ];

        let tabContent = "";
        if (state.route === "/admin/menu") tabContent = renderAdminMenuTab();
        else if (state.route === "/admin/settings") tabContent = renderAdminSettingsTab();
        else tabContent = renderAdminOrdersTab();

        return `
          <div class="min-h-screen bg-muted/40 pb-20 md:pb-0">
            <header class="sticky top-0 z-20 border-b bg-card">
              <div class="mx-auto flex max-w-6xl items-center gap-4 px-4 py-3">
                <a href="#/" onclick="event.preventDefault(); navigate('/')" class="font-semibold hover:text-primary" title="Back to storefront">Anannya Paakshala · Owner</a>
                <nav class="ml-6 hidden gap-1 md:flex">
                  ${tabs
                    .map(
                      (t) => `
                    <a href="#${t.to}" onclick="event.preventDefault(); navigate('${t.to}')"
                      class="rounded-md px-3 py-1.5 text-sm ${
                        state.route === t.to
                          ? "bg-primary/10 text-primary font-medium"
                          : "text-muted-foreground hover:bg-muted"
                      }">
                      ${t.label}
                    </a>`
                    )
                    .join("")}
                </nav>
                <div class="ml-auto flex items-center gap-2">
                  <a href="#/" onclick="event.preventDefault(); navigate('/')" class="rounded-md px-2.5 py-1.5 text-xs text-muted-foreground hover:bg-muted">Storefront</a>
                  <button type="button" onclick="ownerSignOut()" class="inline-flex h-8 items-center gap-1 rounded-md px-3 text-xs font-medium hover:bg-accent">
                    Sign out
                  </button>
                </div>
              </div>
            </header>
            <main class="mx-auto max-w-6xl p-4">${tabContent}</main>
            <nav class="fixed inset-x-0 bottom-0 z-20 grid grid-cols-3 border-t bg-card md:hidden">
              ${tabs
                .map(
                  (t) => `
                <a href="#${t.to}" onclick="event.preventDefault(); navigate('${t.to}')"
                  class="flex flex-col items-center py-2.5 text-xs ${
                    state.route === t.to
                      ? "text-primary font-medium"
                      : "text-muted-foreground"
                  }">
                  ${t.label}
                </a>`
                )
                .join("")}
            </nav>
          </div>
        `;
      }

      // =========================================================================
      // 10. MAIN RENDER ROUTER
      // =========================================================================

      function render() {
        const root = document.getElementById("app");
        if (!root) return;

        const r = state.route;
        if (r === "/cart") {
          root.innerHTML = renderCartPage();
        } else if (r.startsWith("/order/")) {
          const orderId = r.slice("/order/".length);
          root.innerHTML = renderOrderPage(orderId);
        } else if (r === "/admin" || r.startsWith("/admin/")) {
          root.innerHTML = renderAdminLayout();
        } else {
          root.innerHTML = renderHomePage();
        }
      }

      // Initialize app on load
      window.addEventListener("DOMContentLoaded", () => {
        render();
      });
    </script>
  </body>
</html>
